services:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://churn:churn@db:5432/churn
      MODELS_DIR: /app/models
    volumes:
      # Mount models/ so `make retrain` updates the container without a rebuild
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       churn
      POSTGRES_USER:     churn
      POSTGRES_PASSWORD: churn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
